name: VaultPay Core Engine CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Code Quality & Testing Gates
    runs-on: ubuntu-latest

    services:
      # Spin up a live ephemeral Redis instance for validation tests in the cloud
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Check out Repository Codebase
        uses: actions/checkout@v4

      - name: Set up Production Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # 🔓 DECODE CRYPTOGRAPHIC KEYS ON THE FLY
      - name: Inject Decoded Asymmetric Keys for Testing
        run: |
          echo "${{ secrets.BASE64_PRIVATE_KEY }}" | base64 --decode > private_key.pem
          echo "${{ secrets.BASE64_PUBLIC_KEY }}" | base64 --decode > public_key.pem

      - name: Run Native Code Verification (Typecheck & Vet)
        run: go vet ./...

      - name: Execute Test Suite with Data Race Detection
        run: go test -v -race ./...
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  build-verification:
    name: Docker Compilation Verification
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Check out Repository Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx Builder Engine
        uses: docker/setup-buildx-action@v3

      - name: Build and Verify Multi-Stage API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false