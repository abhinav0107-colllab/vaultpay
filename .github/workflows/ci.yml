name: VaultPay Core Engine CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Code Quality Check Gates
    runs-on: ubuntu-latest

    services:
      # Spin up a live ephemeral Redis instance so your validation tests can run successfully in the cloud
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Check out Repository Codebase
        uses: actions/checkout@v4

      - name: Set up Production Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Matches your local development engine build targets
          cache: true

      - name: Install Project Dependencies
        run: go mod download

      - name: Run Code Linter Check
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.55
          skip-cache: true

      - name: Execute Test Suite with Data Race Detection
        # 🔥 DAY 20 SPECIFIC REQUIREMENT: -race detector ensures concurrent thread safety
        run: go test -v -race ./...
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  build-verification:
    name: Docker Compilation Verification
    runs-on: ubuntu-latest
    needs: lint-and-test # Only run this if our code quality and unit tests pass clean!

    steps:
      - name: Check out Repository Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx Builder Engine
        uses: docker/setup-buildx-action@v3

      - name: Build and Verify Multi-Stage API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Simply verify that it builds without compilation errors for now!