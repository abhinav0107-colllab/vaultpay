version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultpay-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: vaultpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 🔥 ENSURE POSTGRES IS LIVE BEFORE ACCEPTING OTHER CONNECTIONS
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vaultpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaultpay-cache
    ports:
      - "6379:6379"
    # 🔥 ENSURE REDIS IS LIVE BEFORE ACCEPTING CACHING TRANSACTIONS
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vaultpay-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultpay-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: secretpassword
      DB_NAME: vaultpay
      REDIS_HOST: redis
      REDIS_PORT: 6379
    # Wait strictly for our supporting infrastructure health layers to hit solid green states
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: