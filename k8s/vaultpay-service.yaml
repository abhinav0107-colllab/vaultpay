apiVersion: v1
kind: Service
metadata:
  name: vaultpay-api-service
spec:
  type: NodePort
  selector:
    app: vaultpay-api
  ports:
    - protocol: TCP
      port: 8080      # Internal cluster routing port
      targetPort: 8080 # Target port exposed on the Go container
      nodePort: 30080  # Fixed local port to access via localhost browser     